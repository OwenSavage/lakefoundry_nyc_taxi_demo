[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-trip-explorer"
version = "0.1.0"
description = "Streamlit app for exploring NYC taxi trips in Databricks"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.36.0",
  "databricks-sql-connector>=3.5.0",
  "pandas>=2.2.0",
  "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
